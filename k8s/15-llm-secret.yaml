# Demo key only; scripts/start-gateway.sh overwrites it with the host gateway's LOCAL key
# (llm_gateway/.gateway-key). The xAI OAuth token is never put in k8s. For a real provider create it out-of-band instead, e.g.
#   kubectl -n agent-demo create secret generic llm-api-key --from-literal=api-key="$XAI_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-key
  namespace: agent-demo
type: Opaque
stringData:
  api-key: sk-mock-demo-0001
