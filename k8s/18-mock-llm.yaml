# Stand-in for an OpenAI-compatible provider (xAI / SuperGrok, OpenAI, vLLM...). Remove when using a real one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: agent-demo
spec:
  replicas: 0   # scaled to 0: LLM now served by the host-side llm_gateway. Set 1 to use it. Fault-injection bookkeeping is in-memory per replica
  selector:
    matchLabels: {app: mock-llm}
  template:
    metadata:
      labels: {app: mock-llm}
    spec:
      containers:
        - name: mock-llm
          image: mock-llm:dev
          imagePullPolicy: Never
          env:
            - name: MOCK_API_KEYS
              valueFrom: {secretKeyRef: {name: llm-api-key, key: api-key}}
            - {name: MOCK_MODEL, value: "grok-mock"}
            - {name: MOCK_LATENCY_S, value: "2"}        # simulated model latency
            - {name: MOCK_FAULT_EVERY, value: "3"}      # ~1/3 of distinct requests...
            - {name: MOCK_FAULT_ATTEMPTS, value: "1"}   # ...fail once (429 or 500) then succeed on retry
            - {name: MOCK_FAULT_CODES, value: "429,500"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: agent-demo
spec:
  selector: {app: mock-llm}
  ports: [{port: 8000, targetPort: 8000}]
